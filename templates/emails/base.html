<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Tell iOS Mail and other clients to always render in light mode -->
    <meta name="color-scheme" content="light">
    <meta name="supported-color-schemes" content="light">
    <title>{% block title %}Scrimverse{% endblock %}</title>
    <style>
        /* Force light color scheme — prevents iOS Mail dark mode from inverting our colors */
        :root { color-scheme: light; }

        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #000000 !important;
            color: #ffffff !important;
            margin: 0 !important;
            padding: 0 !important;
            width: 100% !important;
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
        }

        .email-wrapper {
            background-color: #000000 !important;
            padding: 40px 20px;
            width: 100%;
        }

        .email-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #050505 !important;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }

        .accent-bar {
            height: 4px;
            background-color: #c0ff00 !important;
            width: 100%;
            line-height: 4px;
            font-size: 0;
        }

        .email-header {
            padding: 40px 40px 20px;
            text-align: left;
            background-color: #050505 !important;
        }

        .logo-text {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: -1px;
            color: #ffffff !important;
            text-transform: uppercase;
        }

        .logo-text span {
            color: #c0ff00 !important;
        }

        .email-body {
            padding: 0 40px 40px;
            background-color: #050505 !important;
        }

        /*
         * content-box: white background with dark text.
         * We lock these with !important so iOS Mail dark mode cannot
         * override them and turn the box dark (making dark text invisible).
         */
        .content-box {
            background-color: #ffffff !important;
            color: #000000 !important;
            padding: 30px;
            margin: 20px 0;
            border-left: 3px solid #c0ff00;
        }

        h1,
        h2,
        h3 {
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -0.5px;
            margin-bottom: 20px;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 15px;
            color: rgba(255, 255, 255, 0.8);
        }

        .content-box p,
        .content-box li,
        .content-box span {
            color: #333333 !important;
            margin-bottom: 10px;
        }

        .content-box h1,
        .content-box h2,
        .content-box h3 {
            color: #000000 !important;
        }

        .button {
            display: inline-block;
            background-color: #9f0d0d !important;
            color: #ffffff !important;
            padding: 16px 32px;
            text-decoration: none;
            font-weight: 900;
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 1px;
            margin-top: 20px;
            -webkit-text-size-adjust: none;
        }

        .footer {
            padding: 40px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            background-color: #000000 !important;
        }

        .footer-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .footer-logo-svg {
            width: 30px;
            height: 30px;
            fill: #c0ff00 !important;
        }

        .stay-connected {
            font-size: 18px;
            font-weight: 900;
            color: #ffffff !important;
            margin-bottom: 10px;
        }

        .footer-links {
            color: #666666 !important;
            font-size: 12px;
            margin-top: 20px;
        }

        .footer-links a {
            color: #c0ff00 !important;
            text-decoration: none;
        }

        .status-pill {
            display: inline-block;
            padding: 4px 12px;
            background-color: rgba(192, 255, 0, 0.1) !important;
            color: #c0ff00 !important;
            border: 1px solid #c0ff00;
            font-size: 10px;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        @media only screen and (max-width: 600px) {
            .email-header,
            .email-body,
            .footer {
                padding: 20px !important;
            }

            .content-box {
                padding: 20px !important;
            }
        }

        /* Extra guard: some clients support @media (prefers-color-scheme).
           We explicitly re-assert light backgrounds so nothing flips dark. */
        @media (prefers-color-scheme: dark) {
            body, .email-wrapper {
                background-color: #000000 !important;
                color: #ffffff !important;
            }
            .email-container, .email-header, .email-body {
                background-color: #050505 !important;
            }
            .content-box {
                background-color: #ffffff !important;
                color: #000000 !important;
            }
            .content-box p,
            .content-box li,
            .content-box span,
            .content-box h1,
            .content-box h2,
            .content-box h3 {
                color: #333333 !important;
            }
            .footer {
                background-color: #000000 !important;
            }
        }
    </style>
</head>

<body>
    <div class="email-wrapper" style="background-color:#000000;padding:40px 20px;">
        <div class="email-container" style="max-width:600px;margin:0 auto;background-color:#050505;border:1px solid rgba(255,255,255,0.1);overflow:hidden;">
            <div class="accent-bar" style="height:4px;background-color:#c0ff00;width:100%;line-height:4px;font-size:0;">&nbsp;</div>
            <div class="email-header" style="padding:40px 40px 20px;background-color:#050505;">
                <div class="logo-text" style="font-size:24px;font-weight:900;letter-spacing:-1px;color:#ffffff;text-transform:uppercase;">SCRIM<span style="color:#c0ff00;">VERSE</span></div>
            </div>

            <div class="email-body" style="padding:0 40px 40px;background-color:#050505;">
                {% block content %}{% endblock %}
            </div>

            <div class="footer" style="padding:40px;border-top:1px solid rgba(255,255,255,0.1);background-color:#000000;">
                <div class="stay-connected" style="font-size:18px;font-weight:900;color:#ffffff;margin-bottom:10px;">Stay Connected With Us!</div>
                <p style="font-size: 14px; color: #666666; margin-bottom: 20px;">
                    Where Practice Meets Passion. The ultimate HQ for your esports journey.
                </p>
                <div class="footer-logo" style="display:flex;align-items:center;gap:10px;margin-bottom:20px;">
                    <!-- Minimalist Logo representation -->
                    <svg class="footer-logo-svg" viewBox="0 0 24 24">
                        <path
                            d="M21 16.5C21 16.88 20.79 17.21 20.47 17.38L12.57 21.82C12.41 21.94 12.21 22 12 22C11.79 22 11.59 21.94 11.43 21.82L3.53 17.38C3.21 17.21 3 16.88 3 16.5V7.5C3 7.12 3.21 6.79 3.53 6.62L11.43 2.18C11.59 2.06 11.79 2 12 2C12.21 2 12.41 2.06 12.57 2.18L20.47 6.62C20.79 6.79 21 7.12 21 7.5V16.5Z" />
                    </svg>
                    <span style="font-weight: 900; letter-spacing: -0.5px;">SCRIMVERSE</span>
                </div>
                <div class="footer-links" style="color:#666666;font-size:12px;margin-top:20px;">
                    <a href="https://scrimverse.com" style="color:#c0ff00;text-decoration:none;">WWW.SCRIMVERSE.COM</a> |
                    <a href="mailto:support@scrimverse.com" style="color:#c0ff00;text-decoration:none;">CONTACT SUPPORT</a>
                    <p style="margin-top:10px;color:#666666;">© 2026 SCRIMVERSE. ALL RIGHTS RESERVED.</p>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
